---
- name: Deploy infrastructure via OpenTofu (cloud.terraform)
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    tf_project_path: "{{ playbook_dir }}/terraform"
    tf_binary: "/usr/local/bin/tofu"

  tasks:
    # ---- Bloco de diagnóstico: remova depois de confirmar que funciona ----
    - name: DEBUG - show resolved paths
      debug:
        msg:
          playbook_dir: "{{ playbook_dir }}"
          resolved_project_path: "{{ tf_project_path }}"

    - name: DEBUG - list terraform dir contents
      command: "ls -la {{ tf_project_path }}"
      register: ls_out
      changed_when: false

    - debug:
        var: ls_out.stdout_lines
    # ------------------------------------------------------------------------

    - name: Run tofu init + apply
      cloud.terraform.terraform:
        project_path: "{{ tf_project_path }}"
        binary_path: "{{ tf_binary }}"
        state: present          # present=apply | planned=plan only | absent=destroy
        force_init: true
        variables:
          environment_name: "{{ tf_environment | default('dev') }}"
      register: tf_result

    - name: Show OpenTofu outputs
      debug:
        msg:
          file_path: "{{ tf_result.outputs.file_path.value }}"
          content: "{{ tf_result.outputs.content.value }}"
