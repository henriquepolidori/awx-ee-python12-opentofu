---
- name: Destroy infrastructure via OpenTofu (cloud.terraform)
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    tf_project_path: "{{ playbook_dir }}/terraform"
    tf_binary: "/usr/local/bin/tofu"

  tasks:
    - name: Run tofu destroy
      cloud.terraform.terraform:
        project_path: "{{ tf_project_path }}"
        binary_path: "{{ tf_binary }}"
        state: absent
        force_init: true
        variables:
          environment_name: "{{ tf_environment | default('dev') }}"
